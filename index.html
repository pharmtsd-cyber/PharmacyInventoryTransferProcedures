<div id="content-transfer" class="row g-4">
    <div class="col-lg-7">
        <div class="card academic-card p-4 h-100">
            <h5 class="academic-title border-bottom pb-2 mb-3">新增調撥項目</h5>

            <div class="row g-3 mb-3">
                <div class="col-6">
                    <label class="form-label fw-bold text-secondary small">撥出單位</label>
                    <select class="form-select border-secondary" id="outDept">
                        <option value="藥庫">藥庫</option>
                        <option value="門診藥局">門診藥局</option>
                        <option value="住院藥局">住院藥局</option>
                        <option value="急診藥局">急診藥局</option>
                        <option value="調配藥局">調配藥局</option>
                    </select>
                </div>
                <div class="col-6">
                    <label class="form-label fw-bold text-secondary small">撥入單位</label>
                    <select class="form-select border-secondary" id="inDept">
                        <option value="門診藥局">門診藥局</option>
                        <option value="住院藥局">住院藥局</option>
                        <option value="急診藥局">急診藥局</option>
                        <option value="調配藥局">調配藥局</option>
                        <option value="藥庫">藥庫</option>
                    </select>
                </div>
            </div>
            
            <div class="row g-2 mb-3 bg-light p-2 border rounded align-items-center position-relative">
                <div class="col-auto"><label class="form-label fw-bold text-secondary small mb-0">操作藥師：</label></div>
                <div class="col-5 position-relative">
                    <div class="input-group input-group-sm">
                        <input type="text" class="form-control border-secondary" id="operatorSearchInput" placeholder="輸入姓名或員編搜尋..." autocomplete="off">
                        <button class="btn btn-outline-secondary" type="button" id="resetOperatorBtn">重置</button>
                    </div>
                    <div id="operator-autocomplete-list" class="autocomplete-items shadow w-100"></div>
                </div>
                <div class="col-auto"><strong id="operatorNameDisplay" class="text-primary"></strong></div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold text-secondary small mb-1">備註說明 (非必填，隨該筆送出)</label>
                <input type="text" class="form-control border-secondary" id="remarkInput" placeholder="填寫特殊狀況或異常註記...">
            </div>

            <div class="btn-group w-100 mb-4 rounded-0">
                <input type="radio" class="btn-check" name="inputMode" id="modeBarcode" checked>
                <label class="btn btn-outline-dark" for="modeBarcode">條碼刷入</label>
                <input type="radio" class="btn-check" name="inputMode" id="modeManual">
                <label class="btn btn-outline-dark" for="modeManual">手動搜尋</label>
            </div>

            <div id="barcodeSection" class="mb-3 position-relative">
                <input type="text" class="form-control form-control-lg border-primary shadow-sm" id="barcodeInput" placeholder="游標置於此，刷入藥袋條碼自動建檔..." autocomplete="off">
                <div id="loadingOverlay" class="hidden position-absolute top-0 start-0 w-100 h-100 bg-white bg-opacity-75 d-flex justify-content-center align-items-center">
                    <span class="spinner-border spinner-border-sm text-primary me-2"></span><span class="fw-bold text-primary">寫入資料庫中...</span>
                </div>
            </div>

            <div id="manualSection" class="mb-3 hidden position-relative">
                <input type="text" class="form-control form-control-lg border-dark" id="drugSearchInput" placeholder="輸入代碼、學名或 SAP 碼搜尋..." autocomplete="off">
                <div id="autocomplete-list" class="autocomplete-items shadow w-100"></div>
                <div id="manualQtySection" class="mt-3 row g-2 hidden">
                    <div class="col-8"><input type="text" class="form-control bg-light border-secondary" id="manualSelectedDrug" readonly></div>
                    <div class="col-4">
                        <input type="number" class="form-control border-primary shadow-sm" id="manualQtyInput" placeholder="數量(按Enter建檔)" min="1">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="col-lg-5">
        <div class="card academic-card p-4 h-100 bg-light">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                <h5 class="academic-title mb-0">近兩日調撥清單</h5>
                <span class="badge bg-primary fs-6" id="queueCount">0 筆</span>
            </div>
            
            <div id="recentList" class="flex-grow-1" style="max-height: 600px; overflow-y: auto; padding-right: 5px;">
                <div class="text-center text-muted mt-5" id="emptyQueueMsg">目前無資料</div>
            </div>
        </div>
    </div>
</div>
