<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亞東紀念醫院 藥學部調撥作業系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="academic-header">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h4 class="mb-0 fw-bold tracking-wide">亞東紀念醫院 藥學部｜智能調撥與嫁接系統</h4>
        <div id="headerUserInfo" class="hidden">
            <span class="badge bg-light text-dark me-2" id="userRoleBadge">藥師</span>
            <strong id="userNameDisplay">姓名</strong> (<span id="userDeptDisplay">單位</span>)
            <button class="btn btn-sm btn-outline-light ms-3" id="logoutBtn">登出系統</button>
        </div>
    </div>
</header>

<div class="container-fluid pt-4 wrapper-container">
    
    <div id="loginSection" class="card academic-card p-4 mx-auto" style="max-width: 450px;">
        <h4 class="text-center mb-4 academic-title">系統登入</h4>
        <div class="mb-4">
            <label class="form-label fw-bold">員工編號</label>
            <input type="text" class="form-control form-control-lg" id="empIdInput" placeholder="請輸入員編 (如: F0601 或 F0598)" autocomplete="off">
        </div>
        <button class="btn academic-btn-primary btn-lg w-100" id="loginBtn">登入驗證</button>
    </div>

    <div id="hubSection" class="hidden mx-auto" style="max-width: 800px;">
        <h5 class="mb-4 text-center academic-title">歡迎登入，<span id="hubUserName"></span>！請選擇作業項目：</h5>
        <div class="row g-4">
            <div class="col-md-4">
                <button class="btn academic-hub-btn w-100 shadow-sm" data-target="transfer">📦<br>進入調撥作業</button>
            </div>
            <div class="col-md-4">
                <button class="btn academic-hub-btn w-100 shadow-sm" data-target="receive">🔔<br>接收通知作業</button>
            </div>
            <div class="col-md-4">
                <button class="btn academic-hub-btn w-100 shadow-sm" data-target="storage">💻<br>藥庫嫁接作業</button>
            </div>
        </div>
    </div>

    <div id="mainSection" class="hidden">
        
        <ul class="nav nav-tabs academic-tabs mb-4" id="mainTabs">
            <li class="nav-item"><a class="nav-link active" data-tab="transfer" href="#">調撥作業</a></li>
            <li class="nav-item hidden" id="tab-receive-li"><a class="nav-link" data-tab="receive" href="#">接收作業</a></li>
            <li class="nav-item hidden" id="tab-storage-li"><a class="nav-link" data-tab="storage" href="#">藥庫嫁接</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="history" href="#">歷史查詢</a></li>
        </ul>

        <div id="content-transfer" class="row g-4">
            
            <div class="col-lg-7">
                <div class="card academic-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h5 class="academic-title mb-0">新增調撥項目</h5>
                        <button class="btn btn-sm btn-outline-secondary hidden" id="backToHubBtn">返回主選單</button>
                    </div>
                    
                    <div class="row g-2 mb-4 bg-light p-2 border rounded align-items-center">
                        <div class="col-auto"><label class="form-label fw-bold text-secondary small mb-0">當前操作藥師員編：</label></div>
                        <div class="col-4"><input type="text" class="form-control form-control-sm border-secondary" id="operatorIdInput"></div>
                        <div class="col-auto"><strong id="operatorNameDisplay" class="text-dark"></strong></div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label class="form-label fw-bold text-secondary small">撥出單位</label>
                            <select class="form-select border-secondary" id="outDept">
                                <option value="藥庫">藥庫</option>
                                <option value="門診藥局">門診藥局</option>
                                <option value="住院藥局">住院藥局</option>
                                <option value="急診藥局">急診藥局</option>
                                <option value="調配藥局">調配藥局</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold text-secondary small">撥入單位</label>
                            <select class="form-select border-secondary" id="inDept">
                                <option value="門診藥局">門診藥局</option>
                                <option value="住院藥局">住院藥局</option>
                                <option value="急診藥局">急診藥局</option>
                                <option value="調配藥局">調配藥局</option>
                                <option value="藥庫">藥庫</option>
                            </select>
                        </div>
                    </div>

                    <div class="btn-group w-100 mb-4 rounded-0">
                        <input type="radio" class="btn-check" name="inputMode" id="modeBarcode" checked>
                        <label class="btn btn-outline-dark" for="modeBarcode">條碼刷入</label>
                        <input type="radio" class="btn-check" name="inputMode" id="modeManual">
                        <label class="btn btn-outline-dark" for="modeManual">手動搜尋</label>
                    </div>

                    <div id="barcodeSection" class="mb-3">
                        <input type="text" class="form-control form-control-lg border-dark" id="barcodeInput" placeholder="在此刷入藥袋條碼..." autocomplete="off">
                    </div>

                    <div id="manualSection" class="mb-3 hidden position-relative">
                        <input type="text" class="form-control form-control-lg border-dark" id="drugSearchInput" placeholder="輸入代碼、學名或 SAP 碼搜尋..." autocomplete="off">
                        <div id="autocomplete-list" class="autocomplete-items shadow"></div>
                        <div id="manualQtySection" class="mt-3 row g-2 hidden">
                            <div class="col-8"><input type="text" class="form-control bg-light border-secondary" id="manualSelectedDrug" readonly></div>
                            <div class="col-4 d-flex">
                                <input type="number" class="form-control border-secondary me-2" id="manualQtyInput" placeholder="數量" min="1">
                                <button class="btn btn-dark" id="confirmManualBtn">確定</button>
                            </div>
                        </div>
                    </div>

                    <div id="unifiedPreviewCard" class="card academic-preview-card p-3 mt-4 hidden">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <h5 id="previewDrugName" class="mb-1 fw-bold text-dark">藥品名稱</h5>
                                <div class="small text-secondary mb-1">
                                    代碼：<span id="previewDrugCode" class="fw-bold text-dark"></span> | 
                                    SAP：<span id="previewSap" class="fw-bold text-dark"></span>
                                </div>
                                <div class="small text-secondary" id="previewPatientInfo"></div>
                            </div>
                            <div class="text-end">
                                <span class="d-block text-secondary small fw-bold">調撥數量</span>
                                <span class="fs-2 fw-bold text-primary" id="previewQty">0</span>
                            </div>
                        </div>
                        <div class="mt-3 text-end border-top pt-2">
                            <button class="btn btn-outline-secondary btn-sm me-2" id="cancelPreviewBtn">取消重刷</button>
                            <button class="btn academic-btn-primary" id="addToQueueBtn">加入調撥貯列 ➔</button>
                        </div>
                    </div>

                </div>
            </div>

            <div class="col-lg-5">
                <div class="card academic-card p-4 h-100 bg-light">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h5 class="academic-title mb-0">待送出貯列</h5>
                        <span class="badge bg-dark fs-6" id="queueCount">0 筆</span>
                    </div>
                    
                    <div id="queueList" class="flex-grow-1" style="max-height: 500px; overflow-y: auto;">
                        <div class="text-center text-muted mt-5" id="emptyQueueMsg">目前無待送出資料</div>
                    </div>

                    <div class="mt-4 pt-3 border-top">
                        <div class="mb-3">
                            <input type="text" class="form-control border-secondary" id="batchRemark" placeholder="備註說明 (非必填，套用至此批所有項目)">
                        </div>
                        <button class="btn btn-success btn-lg w-100 fw-bold tracking-wide" id="submitAllBtn" disabled>確認送出以上資料</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="content-receive" class="card academic-card p-5 hidden text-center"><h4 class="academic-title">接收通知作業區</h4></div>
        <div id="content-storage" class="card academic-card p-5 hidden text-center"><h4 class="academic-title">藥庫批次嫁接作業區</h4></div>
        <div id="content-history" class="card academic-card p-5 hidden text-center"><h4 class="academic-title">歷史紀錄查詢</h4></div>

    </div>
</div>

<script src="js/app.js"></script>
<script src="js/transfer.js"></script>

</body>
</html>
