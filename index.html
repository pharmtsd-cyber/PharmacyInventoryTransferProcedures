<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>亞東紀念醫院 藥品調撥與管藥作業系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="academic-header">
    <div class="container-fluid d-flex justify-content-between align-items-center">
        <h4 class="mb-0 fw-bold tracking-wide">亞東紀念醫院 藥學部｜藥品調撥與管藥作業系統</h4>
        <div id="headerUserInfo" class="hidden">
            <span class="badge bg-warning text-dark me-2 border border-dark shadow-sm" id="userStationBadge">📍 載入中</span>
            <span class="badge bg-light text-dark me-2" id="userRoleBadge">藥師</span>
            <strong id="userNameDisplay">姓名</strong> (<span id="userDeptDisplay">單位</span>)
            <button class="btn btn-sm btn-outline-light ms-3" id="logoutBtn">登出系統</button>
        </div>
    </div>
</header>

<div class="container-fluid pt-4 wrapper-container">
    
    <div id="loginSection" class="card academic-card p-4 mx-auto" style="max-width: 450px;">
        <h4 class="text-center mb-4 academic-title">系統登入</h4>
        
        <div class="mb-3">
            <label class="form-label fw-bold">📍 本機作業單位 (鎖定設備)</label>
            <select class="form-select form-select-lg bg-light border-secondary" id="stationSelect">
                <option value="門診藥局">門診藥局 (藍)</option>
                <option value="急診藥局">急診藥局 (紅)</option>
                <option value="住院藥局">住院藥局 (綠)</option>
                <option value="藥庫">藥庫 (灰)</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold">👤 員工編號</label>
            <input type="text" class="form-control form-control-lg" id="empIdInput" placeholder="請輸入員編 (如: F0601)" autocomplete="off">
        </div>
        <button class="btn academic-btn-primary btn-lg w-100 fw-bold" id="loginBtn">登入驗證</button>
    </div>

    <div id="hubSection" class="hidden mx-auto" style="max-width: 900px;">
        <h5 class="mb-4 text-center academic-title">歡迎登入，<span id="hubUserName"></span>！請選擇作業項目：</h5>
        <div class="row g-3">
            <div class="col-md-3">
                <button class="btn academic-hub-btn w-100 shadow-sm" data-target="transfer">📦<br>進入調撥作業</button>
            </div>
            <div class="col-md-3">
                <button class="btn academic-hub-btn w-100 shadow-sm text-danger border-danger" data-target="ctrl-drug">💊<br>1-3級管藥作業</button>
            </div>
            <div class="col-md-3">
                <button class="btn academic-hub-btn w-100 shadow-sm" data-target="receive">🔔<br>接收通知作業</button>
            </div>
            <div class="col-md-3">
                <button class="btn academic-hub-btn w-100 shadow-sm" data-target="storage">💻<br>藥庫嫁接作業</button>
            </div>
        </div>
    </div>

    <div id="mainSection" class="hidden">
        
        <ul class="nav nav-tabs academic-tabs mb-4" id="mainTabs">
            <li class="nav-item"><a class="nav-link active" data-tab="transfer" href="#">調撥作業</a></li>
            
            <li class="nav-item"><a class="nav-link text-danger fw-bold" data-tab="ctrl-drug" href="#">1-3級管藥作業</a></li>
            
            <li class="nav-item hidden" id="tab-receive-li"><a class="nav-link" data-tab="receive" href="#">接收作業</a></li>
            <li class="nav-item hidden" id="tab-storage-li"><a class="nav-link" data-tab="storage" href="#">藥庫SAP作業</a></li>
            <li class="nav-item"><a class="nav-link" data-tab="history" href="#">歷史查詢</a></li>
        </ul>

        <div id="content-transfer" class="row g-4">
            
            <div class="col-lg-7">
                <div class="card academic-card p-4 h-100">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h5 class="academic-title mb-0">新增調撥項目</h5>
                        <button class="btn btn-sm btn-outline-secondary hidden" id="backToHubBtn">返回主選單</button>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label fw-bold text-secondary small">撥出單位</label>
                            <select class="form-select border-secondary" id="outDept">
                                <option value="藥庫">藥庫</option>
                                <option value="門診藥局">門診藥局</option>
                                <option value="住院藥局">住院藥局</option>
                                <option value="急診藥局">急診藥局</option>
                                <option value="調配藥局">調配藥局</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-bold text-secondary small">撥入單位</label>
                            <select class="form-select border-secondary" id="inDept">
                                <option value="門診藥局">門診藥局</option>
                                <option value="住院藥局">住院藥局</option>
                                <option value="急診藥局">急診藥局</option>
                                <option value="調配藥局">調配藥局</option>
                                <option value="藥庫">藥庫</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row g-2 mb-3 bg-light p-2 border rounded align-items-center position-relative">
                        <div class="col-auto"><label class="form-label fw-bold text-secondary small mb-0">操作藥師：</label></div>
                        <div class="col-5 position-relative">
                            <div class="input-group input-group-sm">
                                <input type="text" class="form-control border-secondary" id="operatorSearchInput" placeholder="輸入姓名或員編搜尋..." autocomplete="off">
                                <button class="btn btn-outline-secondary" type="button" id="resetOperatorBtn">重置</button>
                            </div>
                            <div id="operator-autocomplete-list" class="autocomplete-items shadow w-100"></div>
                        </div>
                        <div class="col-auto"><strong id="operatorNameDisplay" class="text-primary"></strong></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small mb-1">備註說明 (非必填，隨該筆送出)</label>
                        <input type="text" class="form-control border-secondary" id="remarkInput" placeholder="填寫特殊狀況或異常註記...">
                    </div>

                    <div class="btn-group w-100 mb-4 rounded-0">
                        <input type="radio" class="btn-check" name="inputMode" id="modeBarcode" checked>
                        <label class="btn btn-outline-dark" for="modeBarcode">條碼刷入</label>
                        <input type="radio" class="btn-check" name="inputMode" id="modeManual">
                        <label class="btn btn-outline-dark" for="modeManual">手動搜尋</label>
                    </div>

                    <div id="barcodeSection" class="mb-3 position-relative">
                        <input type="text" class="form-control form-control-lg border-primary shadow-sm" id="barcodeInput" placeholder="游標置於此，刷入藥袋條碼自動建檔..." autocomplete="off">
                        <div id="loadingOverlay" class="hidden position-absolute top-0 start-0 w-100 h-100 bg-white bg-opacity-75 d-flex justify-content-center align-items-center">
                            <span class="spinner-border spinner-border-sm text-primary me-2"></span><span class="fw-bold text-primary">寫入資料庫中...</span>
                        </div>
                    </div>

                    <div id="manualSection" class="mb-3 hidden position-relative">
                        <input type="text" class="form-control form-control-lg border-dark" id="drugSearchInput" placeholder="輸入代碼、學名或 SAP 碼搜尋..." autocomplete="off">
                        <div id="autocomplete-list" class="autocomplete-items shadow w-100"></div>
                        <div id="manualQtySection" class="mt-3 row g-2 hidden">
                            <div class="col-8"><input type="text" class="form-control bg-light border-secondary" id="manualSelectedDrug" readonly></div>
                            <div class="col-4">
                                <input type="number" class="form-control border-primary shadow-sm" id="manualQtyInput" placeholder="數量(按Enter建檔)" min="1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card academic-card p-4 h-100 bg-light">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h5 class="academic-title mb-0">近兩日調撥清單</h5>
                        <span class="badge bg-primary fs-6" id="queueCount">0 筆</span>
                    </div>
                    
                    <div id="recentList" class="flex-grow-1" style="max-height: 600px; overflow-y: auto; padding-right: 5px;">
                        <div class="text-center text-muted mt-5" id="emptyQueueMsg">目前無資料</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="content-ctrl-drug" class="row g-4 hidden">
            <div class="col-lg-7">
                <div class="card academic-card p-4 h-100 border-danger border-2">
                    <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                        <h5 class="text-danger fw-bold mb-0">💊 一到三級管制藥作業</h5>
                        <span class="badge bg-danger fs-6" id="ctrlStationDisplay">📍 載入中...</span>
                    </div>

                    <div class="mb-3 p-3 bg-light border rounded">
                        <label class="form-label fw-bold text-dark mb-2">📋 選擇作業項目：</label>
                        <select class="form-select form-select-lg border-danger shadow-sm" id="ctrlActionType">
                            <option value="一般處方調劑" data-sign="-1">一般處方調劑 (扣帳)</option>
                            <option value="病房常備領用" data-sign="-1">病房常備領用 (扣帳)</option>
                            <option value="住院退藥" data-sign="1">住院退藥 (入帳)</option>
                            <option value="毀損報銷" data-sign="-1">毀損報銷 (扣帳)</option>
                            <option value="盤盈虧調整" data-sign="1">盤盈虧調整 (請備註)</option>
                        </select>
                    </div>
                    
                    <div class="row g-2 mb-3 align-items-center">
                        <div class="col-auto"><label class="form-label fw-bold text-secondary small mb-0">操作藥師：</label></div>
                        <div class="col-auto"><strong id="ctrlOperatorDisplay" class="text-primary fs-5"></strong></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold text-secondary small mb-1">備註說明 (退藥/報銷必填)</label>
                        <input type="text" class="form-control border-secondary" id="ctrlRemarkInput" placeholder="填寫病歷號、退藥原因或破瓶情況...">
                    </div>

                    <div id="ctrlBarcodeSection" class="mb-3 position-relative">
                        <label class="form-label fw-bold text-danger">請刷入管藥條碼：</label>
                        <input type="text" class="form-control form-control-lg border-danger shadow-sm" id="ctrlBarcodeInput" placeholder="游標置於此，刷入條碼將進行嚴格核對..." autocomplete="off">
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card academic-card p-4 h-100 bg-light border-danger">
                    <div class="d-flex justify-content-between align-items-center border-bottom border-danger pb-2 mb-3">
                        <h5 class="text-danger fw-bold mb-0">今日管藥操作紀錄</h5>
                        <span class="badge bg-danger fs-6" id="ctrlQueueCount">0 筆</span>
                    </div>
                    <div id="ctrlRecentList" class="flex-grow-1" style="max-height: 600px; overflow-y: auto;">
                        <div class="text-center text-muted mt-5">目前無資料</div>
                    </div>
                </div>
            </div>
        </div>

        <div id="content-receive" class="card academic-card p-5 hidden text-center"><h4 class="academic-title">接收通知作業區</h4></div>
        <div id="content-history" class="hidden">
            <div class="card academic-card p-4">
                <h5 class="academic-title border-bottom pb-2 mb-3">線上調撥紀錄查詢與異常通報</h5>
                
                <div class="row g-3 mb-4 align-items-end">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">開始日期</label>
                        <input type="date" class="form-control" id="histStartDate">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">結束日期</label>
                        <input type="date" class="form-control" id="histEndDate">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-primary w-100" id="histSearchBtn">🔍 查詢紀錄</button>
                    </div>
                </div>

                <div id="histLoading" class="text-center text-primary my-4 hidden">
                    <span class="spinner-border spinner-border-sm me-2"></span>資料載入中...
                </div>
                
                <div id="histResultList" style="max-height: 600px; overflow-y: auto;">
                    <div class="text-center text-muted mt-4">請選擇日期區間並點擊查詢</div>
                </div>
            </div>
        </div>

        <div id="content-storage" class="hidden">
            <div class="card academic-card p-4 bg-light">
                <div class="d-flex justify-content-between align-items-center border-bottom pb-2 mb-3">
                    <h5 class="academic-title mb-0">藥庫SAP作業</h5>
                    <a href="https://你的SharePoint藥品清單網址..." target="_blank" class="btn btn-sm btn-warning fw-bold shadow-sm">
                        ✏️ 更新藥品清單主檔
                    </a>
                </div>

                <div class="row g-3 mb-4 align-items-end bg-white p-3 rounded border">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">開始日期</label>
                        <input type="date" class="form-control" id="sapStartDate">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small">結束日期</label>
                        <input type="date" class="form-control" id="sapEndDate">
                    </div>
                    <div class="col-md-4">
                        <button class="btn btn-dark w-100" id="sapSearchBtn">📥 撈取未處理清單</button>
                    </div>
                </div>

                <div id="sapLoading" class="text-center text-dark my-4 hidden">
                    <span class="spinner-border spinner-border-sm me-2"></span>資料撈取與分群中...
                </div>
                
                <div id="sapResultList" style="max-height: 700px; overflow-y: auto;">
                    <div class="text-center text-muted mt-4">請點擊上方按鈕撈取資料</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="js/app.js"></script>
<script src="js/transfer.js"></script>
<script src="js/manage.js"></script>

<script src="js/ctrl_drug.js"></script>

</body>
</html>
